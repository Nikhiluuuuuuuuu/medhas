version: 1
disable_existing_loggers: false

# Root + third-party defaults. Medhas subsystem loggers are configured below.
formatters:
  json:
    format: '{"ts":"%(asctime)s","level":"%(levelname)s","logger":"%(name)s","msg":"%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%S%z"
  text:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stderr
    formatter: text
  json_file:
    class: logging.handlers.RotatingFileHandler
    filename: logs/medhas.log
    maxBytes: 10485760          # 10 MB
    backupCount: 5
    encoding: utf-8
    formatter: json

loggers:
  medhas:
    level: INFO
    handlers: [console]
    propagate: false
  medhas.llm:
    level: INFO
    handlers: [console]
    propagate: false
  medhas.storage:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn:
    level: WARNING
    handlers: [console]
    propagate: false
  uvicorn.access:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]
