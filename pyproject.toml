[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-memory-engine"
version = "1.0.0"
description = "Production 4-in-1 Unified Local AI Agent Memory System (Letta + Mem0 + Zep/Graphiti + Convex)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "groq>=0.9.0",
    "fastembed>=0.3.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

