[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medhas"
version = "0.43.0"
description = "Medhas — production-grade unified AI agent memory engine (Letta + Mem0 + Zep/Graphiti + HippoRAG-style cognition) with a provider-agnostic LLM integration layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Medhas" }]
keywords = ["agent-memory", "llm", "rag", "knowledge-graph", "pgvector", "mem0", "letta", "graphiti"]
dependencies = [
    # Database
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    # Config & schemas
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    # Provider-agnostic LLM + embeddings (NO hard-coded vendor SDK — select via LLM_PROVIDER)
    "openai>=1.30.0",            # OpenAI-compatible client covers OpenAI, Groq, Ollama, vLLM, LM Studio
    "litellm>=1.40.0",           # optional: one interface to 100+ backends (anthropic/gemini/bedrock/...)
    "fastembed>=0.3.0",          # default local embeddings (no network)
    # Graph & math
    "networkx>=3.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",       # cross-encoder reranker support
    # API server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    # Local reranker (Mem0-style, no API)
    "sentence-transformers>=3.0.0",
    # Misc
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# Extra provider SDKs — install only what you configure via LLM_PROVIDER / EMBEDDER_BACKEND.
anthropic = ["anthropic>=0.40.0"]
gemini = ["google-generativeai>=0.7.0"]
bedrock = ["boto3>=1.34.0"]
reranker = ["sentence-transformers>=3.0.0", "torch>=2.1.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.5.0",
]

[project.scripts]
medhas-server = "server:main"
medhas-test = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["medhas*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 300
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E501"]
