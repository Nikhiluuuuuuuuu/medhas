version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: local_unified_memory_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_password
      POSTGRES_DB: unified_memory
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d unified_memory"]
      interval: 3s
      timeout: 3s
      retries: 5

  medhas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medhas_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_password
      POSTGRES_DB: unified_memory
      MEDHAS_LOG_FORMAT: json
      MEDHAS_LOG_FILE: /app/logs/medhas.log
    volumes:
      - medhas_logs:/app/logs

volumes:
  pg_data:
  medhas_logs:
