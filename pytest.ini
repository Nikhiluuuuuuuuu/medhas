[pytest]
asyncio_mode = auto
# All async tests + fixtures share ONE event loop for the whole session. This is
# required because DatabasePool (asyncpg) binds its connection pool to a single event
# loop; with the default per-test loop, the pool ended up "attached to a different
# loop" and every DB call failed. A single session loop keeps the pool valid.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
